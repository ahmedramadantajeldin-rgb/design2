<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2447">
<title>Mechanical Design II — Course Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (shared palette with the lectures) ===== */
:root{
  --navy:#0B2447; --royal:#1B4F8A; --sky:#2E86C1; --azure:#5DADE2; --mist:#D6EAF8; --pearl:#EBF5FB;
  --ink:#1A1A2E; --graphite:#2C3E50; --slate:#5D6D7E; --steel:#AEB8C2; --amber:#F0B429;
  --shadow:0 2px 10px rgba(11,36,71,.08); --shadow-lg:0 10px 28px rgba(11,36,71,.16);
  --radius:12px; --radius-sm:8px; --max:1120px; --gutter:clamp(16px,4vw,32px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;font-size:16px;line-height:1.7;color:var(--ink);min-height:100vh;
  background:linear-gradient(180deg,#eef5fc 0%,#f6f9fd 100%)}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.ar{direction:rtl;unicode-bidi:isolate}
/* ===== Content protection (deterrent only) ===== */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* ===== Top bar ===== */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,36,71,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(93,173,226,.25);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:var(--max);margin:0 auto;padding:10px var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1rem 'Playfair Display',serif}
.brand svg{width:26px;height:26px;flex:none}
.bar nav{display:flex;gap:8px;align-items:center}
.bar nav a{text-decoration:none;font:500 .78rem 'JetBrains Mono',monospace;letter-spacing:.5px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);transition:background .2s,border-color .2s}
.bar nav a:hover,.bar nav a:focus-visible{background:rgba(93,173,226,.25);outline:none}
.bar nav a:focus-visible{box-shadow:0 0 0 2px var(--amber)}
.bar nav a.hub-link{border-color:rgba(93,173,226,.45);color:#d3e3f3;display:inline-flex;align-items:center;gap:4px;direction:rtl;font-family:'Cairo',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:0;white-space:nowrap}
.bar nav a.hub-link:hover{background:rgba(93,173,226,.3);color:#fff;border-color:var(--azure)}

/* ===== Hero: blueprint + meshing gears (2:1 ratio, turning in opposite directions) ===== */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#071a38 0%,var(--navy) 50%,var(--royal) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(93,173,226,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(93,173,226,.09) 1px,transparent 1px),
  linear-gradient(rgba(93,173,226,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(93,173,226,.04) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px}
.hero-in{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:clamp(44px,7vw,84px) var(--gutter) clamp(48px,7.5vw,88px);min-height:clamp(240px,34vw,340px);display:flex;flex-direction:column;justify-content:center}
.hero-txt{position:relative;z-index:2;max-width:640px}
h1{font:800 clamp(2.3rem,6.2vw,4rem)/1.1 'Playfair Display',serif;letter-spacing:-.01em;margin:0;text-shadow:0 2px 18px rgba(93,173,226,.3)}
/* dimension-line motif under the title */
.dim{display:flex;align-items:center;width:clamp(72px,12vw,120px);height:10px;margin:18px 0 16px;color:var(--amber)}
.dim::before,.dim::after{content:"";width:2px;height:10px;background:currentColor;flex:none}
.dim i{flex:1;height:2px;background:currentColor;transform-origin:left center}
.lead{margin:0;width:fit-content;max-width:100%;color:#d3e3f3;font-size:clamp(1rem,2.2vw,1.12rem);line-height:1.8;font-weight:400}
.draw{position:absolute;z-index:1;right:var(--gutter);top:50%;width:clamp(230px,36vw,400px);transform:translateY(-50%);filter:drop-shadow(0 0 16px rgba(93,173,226,.28));pointer-events:none}
.g1,.g2{transform-box:fill-box;transform-origin:center}
.g1{animation:spin 80s linear infinite}
.g2{animation:spin 40s linear infinite reverse}   /* 8 teeth vs 16 teeth => twice the speed, opposite direction */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.hero .r1{animation-delay:.05s}.hero .r2{animation-delay:.3s}
.dim i{animation:draw .7s .25s cubic-bezier(.2,.7,.2,1) backwards}

/* ===== Lectures ===== */
main{max-width:var(--max);margin:0 auto;padding:clamp(28px,4.5vw,44px) var(--gutter) 56px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #d3e2f0}
.sec-title h2{margin:0;font:700 1.15rem 'Playfair Display',serif;color:var(--navy)}
.sec-title span{font:400 .75rem 'JetBrains Mono',monospace;color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
/* Lecture card — whole card is the link; rendered from the LECTURES array */
.card{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px 12px 12px;text-decoration:none;color:inherit;
  background:#fff;border:1px solid #d3e2f0;border-radius:var(--radius);box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;-webkit-tap-highlight-color:transparent}
.no{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:#fff;font:800 1.2rem/1 'Playfair Display',serif;
  background:linear-gradient(135deg,var(--navy),var(--royal));transition:background .22s}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.txt strong{font:700 1.05rem/1.3 'Playfair Display',serif;color:var(--navy);overflow-wrap:anywhere}
.txt .t-ar{align-self:flex-start;font-size:.88rem;font-weight:600;line-height:1.5;color:var(--royal)}
.go{flex:none;width:18px;height:18px;color:var(--sky);transition:transform .22s ease,color .22s}
.card:active{transform:scale(.985);border-color:var(--azure)}
.card:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media (hover:hover){
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--azure)}
  .card:hover .no{background:linear-gradient(135deg,var(--royal),var(--sky))}
  .card:hover .go{transform:translateX(4px);color:var(--royal)}
}
/* Reveal on scroll (only when JS is running; never hides content otherwise) */
.js .card:not(.in){opacity:0}
.card.in{animation:rise .5s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.foot{max-width:var(--max);margin:0 auto;padding:0 var(--gutter) calc(32px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--slate);font:400 .78rem 'JetBrains Mono',monospace}

@media(max-width:820px){.draw{opacity:.45;right:-34px;width:clamp(210px,52vw,300px)}}
@media(max-width:520px){
  .bar nav a:not(.hub-link){display:none}
  .bar nav a.hub-link{font-size:.78rem;min-height:40px;padding:5px 10px}
  .brand{font-size:.88rem;gap:8px;white-space:nowrap;min-width:0}
  .brand svg{width:22px;height:22px}
  .draw{opacity:.3;right:-56px}
  .grid{gap:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
@media print{.bar{display:none}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#top"><svg viewBox="0 0 32 32" fill="none" stroke="#5DADE2" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="5"/><circle cx="16" cy="16" r="11" stroke-dasharray="4.3 2.9" stroke-width="4"/></svg><span id="brandName">Mechanical Design II</span></a>
  <nav aria-label="Primary">
    <a href="https://ahmedramadantajeldin-rgb.github.io/MechLibrary/" class="hub-link" lang="ar" title="العودة إلى MechHub"><span aria-hidden="true">→</span><span>العودة إلى MechHub</span></a>
    <a href="#lectures">LECTURES</a>
  </nav>
</div></header>

<section class="hero" id="top">
  <!-- Decorative blueprint: two meshing gears (16 & 8 teeth) + a dimension line -->
  <svg class="draw" viewBox="0 0 320 290" fill="none" stroke="#5DADE2" aria-hidden="true">
    <g class="g1" stroke-width="1.5">
      <path d="M197.5 106.4 L210.9 109.9 L210.9 120.1 L197.5 123.6 A73.0 73.0 0 0 1 195.3 134.8 L206.3 143.2 L202.4 152.5 L188.7 150.7 A73.0 73.0 0 0 1 182.3 160.2 L189.3 172.1 L182.1 179.3 L170.2 172.3 A73.0 73.0 0 0 1 160.7 178.7 L162.5 192.4 L153.2 196.3 L144.8 185.3 A73.0 73.0 0 0 1 133.6 187.5 L130.1 200.9 L119.9 200.9 L116.4 187.5 A73.0 73.0 0 0 1 105.2 185.3 L96.8 196.3 L87.5 192.4 L89.3 178.7 A73.0 73.0 0 0 1 79.8 172.3 L67.9 179.3 L60.7 172.1 L67.7 160.2 A73.0 73.0 0 0 1 61.3 150.7 L47.6 152.5 L43.7 143.2 L54.7 134.8 A73.0 73.0 0 0 1 52.5 123.6 L39.1 120.1 L39.1 109.9 L52.5 106.4 A73.0 73.0 0 0 1 54.7 95.2 L43.7 86.8 L47.6 77.5 L61.3 79.3 A73.0 73.0 0 0 1 67.7 69.8 L60.7 57.9 L67.9 50.7 L79.8 57.7 A73.0 73.0 0 0 1 89.3 51.3 L87.5 37.6 L96.8 33.7 L105.2 44.7 A73.0 73.0 0 0 1 116.4 42.5 L119.9 29.1 L130.1 29.1 L133.6 42.5 A73.0 73.0 0 0 1 144.8 44.7 L153.2 33.7 L162.5 37.6 L160.7 51.3 A73.0 73.0 0 0 1 170.2 57.7 L182.1 50.7 L189.3 57.9 L182.3 69.8 A73.0 73.0 0 0 1 188.7 79.3 L202.4 77.5 L206.3 86.8 L195.3 95.2 A73.0 73.0 0 0 1 197.5 106.4 Z" fill="rgba(93,173,226,.06)"/>
      <circle cx="125" cy="115" r="80" stroke-opacity=".35" stroke-dasharray="5 4" stroke-width="1"/>
      <circle cx="125" cy="115" r="50" stroke-opacity=".7"/>
      <circle cx="125" cy="115" r="16"/>
      <circle cx="125" cy="115" r="5" stroke="#F0B429"/>
      <path d="M125 45v140M55 115h140" stroke-opacity=".35" stroke-dasharray="6 4" stroke-width="1"/>
      <path d="M125 65v34M125 131v34M75 115h34M141 115h34" stroke-opacity=".6"/>
    </g>
    <g class="g2" stroke-width="1.5">
      <path d="M243.4 205.2 L253.2 212.1 L249.1 221.8 L237.4 219.8 A34.0 34.0 0 0 1 229.8 227.4 L231.8 239.1 L222.1 243.2 L215.2 233.4 A34.0 34.0 0 0 1 204.5 233.4 L197.6 243.2 L187.9 239.1 L189.9 227.4 A34.0 34.0 0 0 1 182.3 219.8 L170.6 221.8 L166.5 212.1 L176.3 205.2 A34.0 34.0 0 0 1 176.3 194.5 L166.5 187.6 L170.6 177.9 L182.3 179.9 A34.0 34.0 0 0 1 189.9 172.3 L187.9 160.6 L197.6 156.5 L204.5 166.3 A34.0 34.0 0 0 1 215.2 166.3 L222.1 156.5 L231.8 160.6 L229.8 172.3 A34.0 34.0 0 0 1 237.4 179.9 L249.1 177.9 L253.2 187.6 L243.4 194.5 A34.0 34.0 0 0 1 243.4 205.2 Z" fill="rgba(93,173,226,.06)"/>
      <circle cx="209.85" cy="199.85" r="40" stroke-opacity=".35" stroke-dasharray="5 4" stroke-width="1"/>
      <circle cx="209.85" cy="199.85" r="21" stroke-opacity=".7"/>
      <circle cx="209.85" cy="199.85" r="6" stroke="#F0B429"/>
      <path d="M209.85 179v14M209.85 207v14M189 199.85h14M217 199.85h14" stroke-opacity=".6"/>
    </g>
    <g stroke="#AEB8C2" stroke-width="1" stroke-opacity=".75">
      <path d="M45 272h160M45 266v12M205 266v12"/><path d="M45 272l8-3v6zM205 272l-8-3v6z" fill="#AEB8C2"/>
    </g>
    <text x="125" y="264" fill="#AEB8C2" stroke="none" font-family="JetBrains Mono,monospace" font-size="10" text-anchor="middle">Ø d</text>
  </svg>

  <div class="hero-in">
    <div class="hero-txt">
      <h1 id="courseTitle" class="rise r1">Mechanical Design II</h1>
      <div class="dim rise r1" aria-hidden="true"><i></i></div>
      <p class="lead ar rise r2" id="courseDesc" lang="ar"></p>
    </div>
  </div>
</section>

<main id="lectures">
  <div class="sec-title"><h2>Lectures</h2><span class="mono" id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer class="foot" id="foot"></footer>

<script>
/* ============================================================
   COURSE DATA — to add a lecture, append one object to LECTURES.
   Place its file next to this page (e.g. "Lecture 2.html") and its
   images in assets/lecture-N/.
   The card shows only the number and the title (+ Arabic title).
   Other fields (chapter, description, image, tags, sections, examples)
   are kept in the data for use by the lecture pages / future layouts.
   ============================================================ */
const COURSE = {
  title: "Mechanical Design II",
  description: "ملف يجمع الشرح والملاحظات والمسائل الخاصة بالمادة."
};
const LECTURES = [
  {
    number: 1,
    title: "Power Screws",
    titleAr: "البراغي الناقلة للقدرة",
    chapter: "Chapter 17",
    description: "Converting rotary motion into translatory motion — thread types, torque analysis, efficiency, and self-locking.",
    image: "assets/lecture-1/power-screw-assembly.jpg",
    imageAlt: "Power screw assembly: load, screw, nut and thrust collar",
    link: "Lecture 1.html",
    tags: ["Square · Acme · Buttress", "Torque", "Efficiency", "Self-locking"],
    sections: 12,
    examples: 3
  }
  // , { number: 2, title: "...", titleAr: "...", chapter: "...", description: "...", image: "assets/lecture-2/....jpg", imageAlt: "...", link: "Lecture 2.html", tags: [], sections: 0, examples: 0 }
];

/* ===== Rendering ===== */
document.documentElement.classList.add('js');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');

const ARROW = '<svg class="go" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l6 6-6 6"/></svg>';

function cardHTML(l, i){
  return `<a class="card" href="${esc(l.link)}" style="--d:${(i * 0.07).toFixed(2)}s" aria-label="Lecture ${l.number}: ${esc(l.title)}">
    <span class="no" aria-hidden="true">${pad(l.number)}</span>
    <span class="txt"><strong>${esc(l.title)}</strong>${l.titleAr ? `<span class="t-ar ar">${esc(l.titleAr)}</span>` : ''}</span>
    ${ARROW}
  </a>`;
}

function render(){
  const list = [...LECTURES].sort((a,b) => a.number - b.number);
  document.title = COURSE.title + ' — Course Dashboard';
  $('brandName').textContent = COURSE.title;
  $('courseDesc').textContent = COURSE.description;
  $('count').textContent = `${pad(list.length)} available`;
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('foot').textContent = COURSE.title;

  const cards = document.querySelectorAll('.card');
  if (!('IntersectionObserver' in window)) { cards.forEach(c => c.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -8% 0px' });
  cards.forEach(c => io.observe(c));
}
render();

/* ============================================================
   Front-end content deterrent.
   NOTE: this only discourages casual copying. It is NOT security —
   anyone with technical knowledge can bypass it, and the HTML and
   image files remain downloadable from the server.
   ============================================================ */
(function(){
  const stop = e => e.preventDefault();
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(ev => document.addEventListener(ev, stop));
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(), c = e.ctrlKey || e.metaKey;
    if (e.key === 'F12' ||
        (c && e.shiftKey && ['i','j','c'].includes(k)) ||
        (c && ['u','s'].includes(k)) ||
        (e.metaKey && e.altKey && ['i','j','c','u'].includes(k))) e.preventDefault();
  });
})();
</script>
</body>
