<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2447">
<title>Mechanical Design II — Course Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (shared palette with the lectures) ===== */
:root{
  --navy:#0B2447; --royal:#1B4F8A; --sky:#2E86C1; --azure:#5DADE2; --mist:#D6EAF8; --pearl:#EBF5FB;
  --ink:#1A1A2E; --graphite:#2C3E50; --slate:#5D6D7E; --steel:#AEB8C2; --amber:#F0B429;
  --shadow:0 4px 20px rgba(11,36,71,.10); --shadow-lg:0 12px 40px rgba(11,36,71,.20);
  --radius:14px; --radius-sm:8px; --max:1120px; --gutter:clamp(16px,4vw,32px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'Cairo','Source Serif 4',sans-serif;font-size:17px;line-height:1.7;color:var(--ink);min-height:100vh;
  background:linear-gradient(160deg,#f0f6ff 0%,#e8f1fb 50%,#f5f9ff 100%)}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.ar{direction:rtl;unicode-bidi:isolate}
/* ===== Content protection (deterrent only) ===== */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
/* ===== Top bar ===== */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,36,71,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(93,173,226,.25)}
.bar-in{max-width:var(--max);margin:0 auto;padding:10px var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1rem 'Playfair Display',serif}
.brand svg{width:28px;height:28px}
.bar nav{display:flex;gap:8px;align-items:center}
.bar nav a{text-decoration:none;font:500 .78rem 'JetBrains Mono',monospace;letter-spacing:.5px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);transition:background .2s}
.bar nav a:hover,.bar nav a:focus-visible{background:rgba(93,173,226,.25);outline:none}
/* ===== Hero (blueprint) ===== */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#071a38 0%,var(--navy) 45%,var(--royal) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(93,173,226,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(93,173,226,.10) 1px,transparent 1px),linear-gradient(rgba(93,173,226,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(93,173,226,.05) 1px,transparent 1px);background-size:96px 96px,96px 96px,24px 24px,24px 24px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(transparent,rgba(11,36,71,.35))}
.hero-in{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:clamp(48px,8vw,92px) var(--gutter) clamp(84px,10vw,120px);display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 .74rem 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--amber);border:1px solid rgba(240,180,41,.45);border-radius:999px;padding:3px 14px;margin-bottom:18px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
h1{font:800 clamp(2.1rem,5.4vw,3.7rem)/1.12 'Playfair Display',serif;margin:0 0 16px;text-shadow:0 2px 16px rgba(93,173,226,.35)}
h1 em{font-style:normal;color:var(--azure)}
.lead{max-width:560px;color:#d3e3f3;font-family:'Source Serif 4',serif;font-size:1.08rem;margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{min-width:120px;padding:10px 16px;border-radius:var(--radius-sm);background:rgba(255,255,255,.07);border:1px solid rgba(174,184,194,.35);backdrop-filter:blur(4px)}
.stat b{display:block;font:700 1.7rem/1.1 'Playfair Display',serif;color:#fff}
.stat span{font:400 .7rem 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--steel)}
.draw{width:100%;max-width:380px;justify-self:end;filter:drop-shadow(0 0 18px rgba(93,173,226,.35))}
.gear{transform-origin:130px 130px;animation:spin 60s linear infinite}
.gear2{transform-origin:215px 215px;animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Lectures grid ===== */
main{max-width:var(--max);margin:-62px auto 0;padding:0 var(--gutter) 56px;position:relative;z-index:2}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px;color:#fff}
.sec-title h2{margin:0;font:700 1.15rem 'Playfair Display',serif}
.sec-title span{font:400 .75rem 'JetBrains Mono',monospace;color:var(--steel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:24px}
/* Lecture card — rendered from the LECTURES array */
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid #cfe0ef;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover,.card:focus-within{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--azure)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--navy);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:.9;transition:transform .5s,opacity .3s}
.card:hover .thumb img{transform:scale(1.05);opacity:1}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,36,71,.15),rgba(11,36,71,.75)),linear-gradient(rgba(93,173,226,.12) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(93,173,226,.12) 1px,transparent 1px) 0 0/22px 22px}
.num{position:absolute;z-index:1;left:14px;bottom:12px;display:flex;align-items:baseline;gap:8px;color:#fff}
.num b{font:800 2.6rem/1 'Playfair Display',serif;text-shadow:0 0 18px rgba(93,173,226,.8)}
.num small{font:500 .72rem 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
.chap{position:absolute;z-index:1;right:12px;top:12px;font:500 .7rem 'JetBrains Mono',monospace;background:rgba(11,36,71,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 12px}
.body{display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;flex:1}
.body h3{margin:0;font:700 1.35rem/1.25 'Playfair Display',serif;color:var(--navy)}
.body .t-ar{font-weight:600;color:var(--royal);margin-top:-6px}
.body p{margin:0;color:var(--graphite);font-size:.95rem;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 .7rem 'JetBrains Mono',monospace;background:var(--pearl);color:var(--royal);border:1px solid var(--mist);border-radius:999px;padding:1px 10px}
.facts{display:flex;gap:18px;padding-top:10px;border-top:1px dashed #c6d6e6;font:500 .75rem 'JetBrains Mono',monospace;color:var(--slate)}
.facts b{color:var(--navy);font-size:.95rem}
.open{margin-top:auto;display:inline-flex;align-self:flex-start;align-items:center;gap:10px;text-decoration:none;color:#fff;font:600 .95rem 'Cairo',sans-serif;padding:9px 22px;border-radius:999px;background:linear-gradient(90deg,var(--royal),var(--sky));transition:background .2s,box-shadow .2s}
.open::after{content:"";position:absolute;inset:0}           /* stretched link: whole card is clickable */
.open i{font-style:normal;transition:transform .2s}
.card:hover .open{background:linear-gradient(90deg,var(--navy),var(--royal));box-shadow:0 0 16px rgba(46,134,193,.45)}
.card:hover .open i{transform:translateX(4px)}
.open:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.foot{max-width:var(--max);margin:0 auto;padding:0 var(--gutter) 40px;text-align:center;color:var(--slate);font:400 .78rem 'JetBrains Mono',monospace}
@media(max-width:820px){.hero-in{grid-template-columns:1fr}.draw{display:none}}
@media(max-width:520px){body{font-size:16px}.bar nav a{display:none}.stat{flex:1;min-width:0}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
@media print{.bar{display:none}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#top"><svg viewBox="0 0 32 32" fill="none" stroke="#5DADE2" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="5"/><circle cx="16" cy="16" r="11" stroke-dasharray="4.3 2.9" stroke-width="4"/></svg><span id="brandName">Mechanical Design II</span></a>
  <nav aria-label="Primary"><a href="#lectures">LECTURES</a></nav>
</div></header>

<section class="hero" id="top">
  <div class="hero-in">
    <div>
      <div class="eyebrow"><i></i>Course Dashboard</div>
      <h1 id="courseTitle">Mechanical <em>Design</em> II</h1>
      <p class="lead" id="courseDesc"></p>
      <div class="stats" id="stats"></div>
    </div>
    <!-- Decorative blueprint: meshing gears + dimension lines -->
    <svg class="draw" viewBox="0 0 320 300" fill="none" stroke="#5DADE2" aria-hidden="true">
      <g class="gear" stroke-width="1.5"><circle cx="130" cy="130" r="80" stroke-width="14" stroke-dasharray="11.4 11.4" stroke-opacity=".9"/><circle cx="130" cy="130" r="66"/><circle cx="130" cy="130" r="26"/><circle cx="130" cy="130" r="9" stroke="#F0B429"/><path d="M130 30v200M30 130h200" stroke-opacity=".35" stroke-dasharray="6 4"/></g>
      <g class="gear2" stroke-width="1.5"><circle cx="215" cy="215" r="40" stroke-width="10" stroke-dasharray="11.4 11.4" stroke-opacity=".8"/><circle cx="215" cy="215" r="30"/><circle cx="215" cy="215" r="7" stroke="#F0B429"/></g>
      <g stroke="#AEB8C2" stroke-width="1" stroke-opacity=".8"><path d="M40 286h220M40 280v12M260 280v12"/><path d="M40 286l8-3v6zM260 286l-8-3v6z" fill="#AEB8C2"/><path d="M300 40v220M294 40h12M294 260h12"/></g>
      <g fill="#AEB8C2" stroke="none" font-family="JetBrains Mono,monospace" font-size="10"><text x="150" y="274" text-anchor="middle">Ø d</text><text x="288" y="154" text-anchor="end">L</text></g>
    </svg>
  </div>
</section>

<main id="lectures">
  <div class="sec-title"><h2>Lectures</h2><span class="mono" id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer class="foot" id="foot"></footer>

<script>
/* ============================================================
   COURSE DATA — to add a lecture, append one object to LECTURES.
   Place its file next to this page and its images in
   assets/lecture-N/ (e.g. "Lecture 2.html", assets/lecture-2/).
   ============================================================ */
const COURSE = {
  title: "Mechanical Design II",
  description: "Power screws, thread types, torque analysis, efficiency and self-locking — worked through with figures, derivations and solved examples."
};
const LECTURES = [
  {
    number: 1,
    title: "Power Screws",
    titleAr: "البراغي الناقلة للقدرة",
    chapter: "Chapter 17",
    description: "Converting rotary motion into translatory motion — thread types, torque analysis, efficiency, and self-locking.",
    image: "assets/lecture-1/power-screw-assembly.jpg",
    imageAlt: "Power screw assembly: load, screw, nut and thrust collar",
    link: "Lecture 1.html",
    tags: ["Square · Acme · Buttress", "Torque", "Efficiency", "Self-locking"],
    sections: 12,
    examples: 3
  }
  // , { number: 2, title: "...", titleAr: "...", chapter: "...", description: "...", image: "assets/lecture-2/....jpg", imageAlt: "...", link: "Lecture 2.html", tags: [], sections: 0, examples: 0 }
];

/* ===== Rendering ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');

function cardHTML(l){
  const facts = [l.sections != null && `<span><b>${l.sections}</b> sections</span>`, l.examples != null && `<span><b>${l.examples}</b> worked examples</span>`].filter(Boolean).join('');
  return `<article class="card">
    <div class="thumb">
      <img src="${esc(l.image)}" alt="${esc(l.imageAlt || l.title)}" loading="lazy" draggable="false">
      ${l.chapter ? `<span class="chap">${esc(l.chapter)}</span>` : ''}
      <div class="num"><b>${pad(l.number)}</b><small>Lecture</small></div>
    </div>
    <div class="body">
      <h3>${esc(l.title)}</h3>
      ${l.titleAr ? `<div class="t-ar ar">${esc(l.titleAr)}</div>` : ''}
      <p>${esc(l.description)}</p>
      <div class="tags">${(l.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      ${facts ? `<div class="facts">${facts}</div>` : ''}
      <a class="open" href="${esc(l.link)}" aria-label="Open Lecture ${l.number}: ${esc(l.title)}">Open Lecture <i>→</i></a>
    </div>
  </article>`;
}

function render(){
  const list = [...LECTURES].sort((a,b) => a.number - b.number);
  const secs = list.reduce((s,l) => s + (l.sections || 0), 0);
  const exs  = list.reduce((s,l) => s + (l.examples || 0), 0);
  document.title = COURSE.title + ' — Course Dashboard';
  $('brandName').textContent = COURSE.title;
  $('courseDesc').textContent = COURSE.description;
  $('stats').innerHTML = [[list.length, list.length === 1 ? 'Lecture' : 'Lectures'], [secs, 'Sections'], [exs, 'Worked examples']]
    .map(([n,t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');
  $('count').textContent = `${pad(list.length)} available`;
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('foot').textContent = COURSE.title;
}
render();

/* ============================================================
   Front-end content deterrent.
   NOTE: this only discourages casual copying. It is NOT security —
   anyone with technical knowledge can bypass it, and the HTML and
   image files remain downloadable from the server.
   ============================================================ */
(function(){
  const stop = e => e.preventDefault();
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(ev => document.addEventListener(ev, stop));
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(), c = e.ctrlKey || e.metaKey;
    if (e.key === 'F12' ||
        (c && e.shiftKey && ['i','j','c'].includes(k)) ||
        (c && ['u','s'].includes(k)) ||
        (e.metaKey && e.altKey && ['i','j','c','u'].includes(k))) e.preventDefault();
  });
})();
</script>
</body>
</html>
